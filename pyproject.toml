[project]
name = "aeolus-backend"
version = "0.1.0"
description = "AEOLUS — screening-level wind resource and energy assessment API for Bangladesh."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    # Database
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "geoalchemy2>=0.16",
    # Jobs
    "celery[redis]>=5.4",
    "redis>=5.2",
    # Auth (Step 1)
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.10",
    "slowapi>=0.1.9",
]
# Science, ML and report libraries are added in the step that first needs them.

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
